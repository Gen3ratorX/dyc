<!doctype html><html lang="en"><meta charset="utf-8"><title>Refresh local workspace</title><style>body{font:16px system-ui;color:#31523b;background:#f6f8f2;display:grid;place-items:center;min-height:90vh}button{padding:14px 22px;border:0;border-radius:8px;background:#26765d;color:white;font:inherit;cursor:pointer}</style><main><h1>Refresh the local preview</h1><p>This clears the old app shell. Your saved camp records are kept.</p><button id="refresh">Refresh local workspace</button><p id="status"></p></main><script>document.getElementById('refresh').onclick=async()=>{if(!['localhost','127.0.0.1'].includes(location.hostname))return;document.getElementById('status').textContent='Refreshing…';for(const registration of await navigator.serviceWorker.getRegistrations())await registration.unregister();for(const key of await caches.keys())if(key.startsWith('dyc-shell-'))await caches.delete(key);location.replace('/');};</script></html>
